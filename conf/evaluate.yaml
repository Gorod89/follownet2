# Protocols P1-P4 (and the transfer part of P5) on one trained run (scripts/evaluate.py).
# Extends the training configuration: the run is found by dataset, model, train.version,
# train.split, train.fold and train.seed.
defaults:
  - train
  - _self_

protocols: [p1, p2, p3, p4]  # subset to run, in this order
force: false  # compute again although a result with the same protocol configuration exists

p1:
  horizons: [10.0, 30.0]  # s; the whole event is always included
  batch_windows: 4096
  transfer_datasets: []  # other datasets whose test parts are scored with P1 (p1_<name>.json)

p2:
  precision: full  # TF32 off (follownet2/protocols/evaluate.py); part of the hash so that earlier results recompute
  profiles: data/scenarios/openacc_profiles.json  # built from the AstaZero files when missing
  window: 300.0  # s, length of the OpenACC windows
  n_vehicles: [20, 100]
  hold: 60.0
  # v0 auto: the 95 % speed quantile of the training data, at most v0_max; v_low = v_low_ratio * v0;
  # the tail of 240 s lets the wave (about 2 s per vehicle) reach the hundredth follower
  pulse: {v0: auto, v0_max: 25.0, v_low_ratio: 0.4, decel: -3.0, accel: 1.5, hold_low: 10.0, tail: 240.0}
  source_sample: 20000  # events of the training dataset for the fundamental diagram (null: all)

p3:
  device: cpu  # float64 on the CPU: GPU recurrent layers use TF32, whose noise defeats the settle criterion
  delta: 0.05  # m/s, step of the leader speed for the verdict (linear regime)
  delta_large: 1.0  # m/s, finite perturbation: max_gain_large, unstable_fraction_large
  hold: 120.0
  response: 300.0
  tol: 1.0e-5  # verdict tolerance on the gain; the 1e-3 band is reported next to it

p4:
  precision: full  # TF32 off, as for P2
  hold: 60.0
  episodes: [tgsim]  # near-miss sets (reconstructed and confirmed) rolled by every model
  max_episodes: null
