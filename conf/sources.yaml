  access: application
  redistribution: forbidden
  citation: >-
    Krajewski, R., Bock, J., Kloeker, L., Eckstein, L. (2018). The highD Dataset: A Drone
    Dataset of Naturalistic Vehicle Trajectories on German Highways for Validation of Highly
    Automated Driving Systems. 21st International Conference on Intelligent Transportation
    Systems (ITSC), 2118-2125. https://doi.org/10.1109/ITSC.2018.8569552
  landing_page: https://levelxdata.com/highd-dataset/
  kind: none
  target: highd
  instructions: >-
    Apply on the landing page for the free non-commercial licence (the application asks for
    a confirmation of the intended use). Once it is granted, download the archive and unpack
    the 60 recordings so that data/raw/highd holds XX_recordingMeta.csv, XX_tracksMeta.csv,
    XX_tracks.csv and XX_highway.jpg (XX = 01 to 60). The data must not be redistributed:
    TrafficLoop publishes extraction code and event check sums only, never events.
  expected: ["*_recordingMeta.csv", "*_tracksMeta.csv", "*_tracks.csv"]
  notes:
    - "Format: https://levelxdata.com/wp-content/uploads/2023/10/highD-Format.pdf"

