ngsim:
  title: Next Generation Simulation (NGSIM) Vehicle Trajectories and Supporting Data, I-80 and US-101
  licence: CC BY-SA 3.0 or 4.0 (conflicting metadata)
  licence_url: https://creativecommons.org/licenses/by-sa/4.0/
  access: open
  redistribution: allowed
  citation: >-
    U.S. Department of Transportation Federal Highway Administration. Next Generation
    Simulation (NGSIM) Vehicle Trajectories and Supporting Data [Dataset]. Provided by ITS
    DataHub through Data.transportation.gov. https://doi.org/10.21949/1504477
  landing_page: https://data.transportation.gov/d/8ect-6jqj
  kind: socrata
  target: ngsim
  notes:
    - "The portal shows two licences: the data set licence 'Creative Commons Attribution | Share Alike 3.0 Unported' and the Common Core field License 'https://creativecommons.org/licenses/by-sa/4.0/'."
    - Queries without an app token share an IP-based throttling pool (HTTP 429); a rerun resumes at the first missing page.
  # One Socrata table, one query per location. bytes_estimate: 100 B per quoted CSV row of the
  # 13 selected columns, scaled from a 2,000-row sample (176.6 B/row for all 25 columns, us-101).
  # Names and integer columns match the parquet files of cf-stability (which hold all 25
  # columns) and what trafficloop/data/loaders/ngsim.py reads.
  tables:
    - name: ngsim_i-80_raw
      subset: [i-80]
      id: "8ect-6jqj"
      domain: data.transportation.gov
      where: "location='i-80'"
      rows: 4566387
      bytes_estimate: 457000000
      select: [vehicle_id, frame_id, global_time, local_y, v_vel, v_acc, lane_id, preceding, following, space_headway, time_headway, v_length, v_class]
      dtypes: {vehicle_id: Int64, frame_id: Int64, global_time: Int64, lane_id: Int64, preceding: Int64, following: Int64, v_class: Int64}
    - name: ngsim_us-101_raw
      subset: [us-101]
      id: "8ect-6jqj"
      domain: data.transportation.gov
      where: "location='us-101'"
      rows: 4802933
      bytes_estimate: 481000000
      select: [vehicle_id, frame_id, global_time, local_y, v_vel, v_acc, lane_id, preceding, following, space_headway, time_headway, v_length, v_class]
      dtypes: {vehicle_id: Int64, frame_id: Int64, global_time: Int64, lane_id: Int64, preceding: Int64, following: Int64, v_class: Int64}

