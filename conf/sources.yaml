citysim:
  title: "CitySim: drone vehicle trajectories for safety-oriented research (UCF SST Lab)"
  licence: non-commercial, no redistribution (request form)
  licence_url: https://github.com/UCF-SST-Lab/UCF-SST-CitySim1-Dataset
  access: application
  redistribution: forbidden
  citation: >-
    Zheng, O., Abdel-Aty, M., Yue, L., Abdelraouf, A., Wang, Z., Mahmoud, N. CitySim: A
    Drone-Based Vehicle Trajectory Dataset for Safety-Oriented Research and Digital Twins.
    Transportation Research Record. https://doi.org/10.1177/03611981231185768
  landing_page: https://github.com/UCF-SST-Lab/UCF-SST-CitySim1-Dataset
  kind: none
  target: citysim
  instructions: >-
    Fill in the data request form of the repository (asset/MainPage/Data_Request_Form.pdf or
    .docx: name, institution, advisor, e-mail, research interests, signature), sign it and
    e-mail it to citysim.ucfsst@gmail.com. Its terms: non-commercial research and teaching
    only, cite the paper, no redistribution of the data or of modified versions, derivative
    works only if the data cannot be recovered from them, no commercial use. Expressway A and
    Freeway B and C (Southwest Jiaotong University), Expressway B (Southeast University) and
    Freeway D (PolyU) are distributed by those teams: ask them. Put the files of each site
    under data/raw/citysim/<site>/.
