# TrafficLoop raw data sources: licence, access and exactly what to fetch.
#
# Read by trafficloop/data/download.py and scripts/download_data.py; the licence table for
# readers is docs/licences.md. Values were checked on 2026-09-27 against the hosts' own pages
# and APIs. Sizes are exact bytes unless stated otherwise.
#
# Fields of a source
#   title, licence, licence_url, citation, landing_page
#   access           open | application | manual (manual: public, but fetched by hand)
#   redistribution   of the raw data: allowed | forbidden | unclear
#   kind             files | socrata | none (nothing to fetch automatically)
#   target           directory under data/raw
#   files            kind files: {name (path under target), url, bytes, sha256, md5, subset}.
#                    sha256 is given where known: taken from cf-stability's SOURCES.json when
#                    that project downloaded the same file (same URL and size), or from the
#                    host's API (Mendeley); figshare and Zenodo publish md5 only.
#                    approx: true marks a size the host only shows rounded.
#   tables           kind socrata: {name, id, domain, rows, select, where, bytes_estimate,
#                    dtypes, subset}; each becomes one file <name>.parquet. bytes_estimate is
#                    the estimated size of the CSV pages. dtypes: pandas types of columns
#                    (Int64: integers, blanks allowed); other columns become float64 when
#                    numeric, else string.
#   subset           tags for --subset (an item is also selected by its name)
#   instructions     access other than open: how to obtain the data. No data URLs are listed.
#   expected         kind none: file patterns showing that the data are in place
#   sibling_dir      directory under ../cf-stability/data/raw, when it differs from target
#   notes            caveats that the dry run prints

